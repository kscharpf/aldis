# Coverage waivers (VER-024), checked by `cargo xtask coverage`.
#
# The gate requires 100 % of regions, functions, lines, and branches. Each waiver allows a
# number of misses for one crate and metric, and says why the code cannot be covered. A
# waiver larger than the actual misses also fails, so waivers shrink as tests improve.
# Waivers are reviewed per release.
#
# [[waiver]]
# crate = "aldis-core"
# metric = "branches"          # regions | functions | lines | branches
# count = 1
# justification = "src/x.rs:12 — why this cannot be reached by a test"
#
# aldis-core is fully covered.

[[waiver]]
crate = "aldis-uslp"
metric = "regions"
count = 13
justification = "src/view.rs (1), src/truncated.rs (1), src/writer.rs (11) — the error return of `?` on `framed()` in `truncated::split` (the layout is computed for the length of the frame it is applied to, CMN-040), on `slot()` in the writer, the one checked slice site of that module, the `?` of the two `oid_tfdf` calls in the writer (the frame length limit keeps a TFDZ within the 16-bit pointer; `oid_tfdf` is unit-tested directly with a longer one), and in view.rs on `read_vcf_count()`, whose frame holds the Primary Header including the VCF Count (the layout of `frame_layout` fits it, so the field lies inside the frame). The error is a broken invariant that no input reaches (GEN-020). `framed()` and `slot()` are unit-tested directly with an argument of the wrong length."

