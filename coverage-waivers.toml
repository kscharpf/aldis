[[waiver]]
crate = "aldis-link"
metric = "regions"
count = 252
justification = "src/receiver.rs and src/receiver/*.rs (the largest part; M4 WP-5, after #232) — the error returns of `?` in the five procedures and their helpers, each an explicit error and not a default (GEN-020), counted once for each protocol that instantiates the generic code: on `Actions::push` and `FrameContext::put` and the `deliver_*` helpers (the bound of 5 is driven to its worst case for TM, AOS, and USLP by `tests/frame_receiver.rs`, and the area is checked against `area_len` before the first octet is written), on `header`, `vc_of`, and `map_of` of a field the procedure masked to its width (unit-tested directly in `receiver.rs`), in `lay_out` on `FramedBytes::new` of a layout computed for the frame it is applied to (CMN-040), in the slot lookups of `count_vc`, `change_cycle_use`, and `mark_gap` that only a VC the procedure found is passed to (unit-tested for TC), the `raw_insert_zone_offset` of TM and TC, which `raw_frame` reaches only when the option is on, and the `?` of `header` in the TC and USLP procedures, whose frame length `check_frame` has bounded below by `fits` before the procedure runs (the truncated-frame refusal is reached by tests; the Frame Length field and the reserved USLP flags are checks of the codec and no longer of the receiver, #232). The rest: src/generator.rs, src/extractor.rs, src/protocol.rs — error returns and arms that no input reaches, each an explicit error and not a default (GEN-020): the `?` on `Actions::push` (the bound is 1 for the generator and `EXTRACTOR_MAX_ACTIONS` for the extractor, which `tests/engine_housekeeping.rs` drives to its worst case and `tests/packet_roundtrip.rs` guards, so a list never overflows), on `Cx::write` (`data_field` checks the area against `max_packet_len − 1 + z` before any octet is written), on `P::encode_pointer` (the configuration checks the zone against `max_zone_len`), on the idle packet builders of `aldis-spp` and `aldis-epp` (the configuration checks the lengths they need), on `write_idle_field` and `pull_from_queue` (their checks come before), and the `ok_or(InternalError)` on a split or a `kind_of` of octets that the code built or checked itself (the queue head of an accepted packet, an octet that `accepts` accepted, `fill` within the buffer); in `PacketRun::next` the `?` and the `else` for a run that holds no whole packet (a run is built from packets that the extractor completed); in `protocol.rs` the arm of `Uslp::parse` for a header slice that is not 2 octets after `split_at_checked(2)`. The tests of `tests/engine_housekeeping.rs` and the round trip of `tests/packet_roundtrip.rs` reach every other failure. M4 WP-4 (46 more): in src/mux.rs, src/access.rs, and src/bitstream.rs the `?` of `Actions::push` (the bound is 2 for the mux and 1 for the others, which `tests/channel_mux_engine.rs` and `tests/generators_engine.rs` drive to their worst cases), the `ok_or(InternalError)` on a split, a slice of the frame, or a position that the code built or checked itself (`write_frame`, `pick`, the offer slot at a position found by `find`, the head length of a non-empty queue, `FrameLayout::compute` of a configuration checked by `checked`), the `get_mut` of the count of a VCID below 64, and the octet-by-octet shifts of the SDU queue and the bit queue at an index below their length. None is reachable (GEN-020). M4 WP-6 (105 more): in src/segmenter.rs, src/reassembler.rs, and src/cltu.rs the `?` of `Actions::push` (the bounds are 1, 2, and 2, driven to their worst cases by `tests/map_segmenter_engine.rs`, `tests/map_reassembler_engine.rs`, and `tests/cltu_packer.rs`), the `ok_or(InternalError)` on an entry, a slice, or a slot that the code built or checked itself (the queue entry at a position found by a scan, the MAP of a queued entry, the slot of a MAP found by `find`), the `get_mut` of those slots, the `else` of a pointer slice that `split_at_checked` bounded, and the octet-by-octet shifts of the queue at an index below its length, counted for each protocol that instantiates the generic code. None is reachable (GEN-020). Also src/mux.rs: the `?` of `P::primary_header` in `write_frame`, whose USLP error (a frame length above the 16-bit field) the configuration check rules out; `Uslp::primary_header` is tested directly with such a length."

