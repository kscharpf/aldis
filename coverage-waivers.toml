# Coverage waivers (VER-024), checked by `cargo xtask coverage`.
#
# The gate requires 100 % of regions, functions, lines, and branches. Each waiver allows a
# number of misses for one crate and metric, and says why the code cannot be covered. A
# waiver larger than the actual misses also fails, so waivers shrink as tests improve.
# Waivers are reviewed per release.
#
# [[waiver]]
# crate = "aldis-core"
# metric = "branches"          # regions | functions | lines | branches
# count = 1
# justification = "src/x.rs:12 — why this cannot be reached by a test"
#
# aldis-core is fully covered.

[[waiver]]
crate = "aldis-uslp"
metric = "regions"
count = 11
justification = "src/view.rs (1), src/truncated.rs (1), src/writer.rs (9) — the error return of `?` on `framed()` in `truncated::split` (the layout is computed for the length of the frame it is applied to, CMN-040), on `slot()` in the writer, the one checked slice site of that module, and in view.rs on `read_vcf_count()`, whose frame holds the Primary Header including the VCF Count (the layout of `frame_layout` fits it, so the field lies inside the frame). The error is a broken invariant that no input reaches (GEN-020). `framed()` and `slot()` are unit-tested directly with an argument of the wrong length."

[[waiver]]
crate = "aldis-cop1"
metric = "regions"
count = 9
justification = "src/fop1.rs — arms and error returns that no input reaches, each an explicit error or a skipped step and not a default (GEN-020): in `Fop1Target::tc`, `VcConfig::new` and `VcTable::new` (after `PhysicalChannelConfig::new` accepted the same length and FECF), the `?` of the `encode` calls (the FDU was checked against `max_fdu_len` by `check_fdu`, and a Control Command always fits); in `encode_at` the arm for an error of `encode` other than BufferTooSmall (which `encode` does not return for a checked input); in `Fop1::commit` the `split_first_mut` of a position that is below `Q` by the loop bound, and the arm for a new Type-AD entry whose FDU is missing (its decision encoded the same frame); and `push_sent` in `transmit_bc` (the cells that transmit a Type-BC frame run Initialize first, which empties the Sent_Queue). The sweep test `every_failure_of_a_cell_leaves_the_state_unchanged` reaches every other failure of a cell."

[[waiver]]
crate = "aldis-cop1"
metric = "lines"
count = 3
justification = "`encode_at` (the arm of `Fop1Target::encode_at` for an error of `encode` other than BufferTooSmall), `Fop1::commit` (the `else` of `split_first_mut` for a position below `Q`, and the arm for a new Type-AD entry without its FDU): each is a branch that the loop bound or the decision's own earlier encode of the same frame excludes, and that is left as a skip and not a default (GEN-020)."

[[waiver]]
crate = "aldis-cop1"
metric = "branches"
count = 1
justification = "`Fop1::commit` in src/fop1.rs: the `split_first_mut` of the slice from position `p`, which is below `Q` by the loop bound, has no `None` case."

[[waiver]]
crate = "aldis-link"
metric = "regions"
count = 66
justification = "src/generator.rs, src/extractor.rs, src/protocol.rs — error returns and arms that no input reaches, each an explicit error and not a default (GEN-020): the `?` on `Actions::push` (the bound is 1 for the generator and `EXTRACTOR_MAX_ACTIONS` for the extractor, which `tests/engine_housekeeping.rs` drives to its worst case and `tests/packet_roundtrip.rs` guards, so a list never overflows), on `Cx::write` (`data_field` checks the area against `max_packet_len − 1 + z` before any octet is written), on `P::encode_pointer` (the configuration checks the zone against `max_zone_len`), on the idle packet builders of `aldis-spp` and `aldis-epp` (the configuration checks the lengths they need), on `write_idle_field` and `pull_from_queue` (their checks come before), and the `ok_or(InternalError)` on a split or a `kind_of` of octets that the code built or checked itself (the queue head of an accepted packet, an octet that `accepts` accepted, `fill` within the buffer); in `PacketRun::next` the `?` and the `else` for a run that holds no whole packet (a run is built from packets that the extractor completed); in `protocol.rs` the arm of `Uslp::parse` for a header slice that is not 2 octets after `split_at_checked(2)`. The tests of `tests/engine_housekeeping.rs` and the round trip of `tests/packet_roundtrip.rs` reach every other failure."

[[waiver]]
crate = "aldis-link"
metric = "lines"
count = 11
justification = "src/generator.rs, src/extractor.rs, src/protocol.rs — the lines of the error returns of the regions above that have a line of their own: `Look::More` for an empty buffer (`look` runs after a push), the `else` of `emit` for an empty buffer (`emit` runs on a complete packet), the `let ... else` on `packet::length` of a queued packet, the `else` of `PacketRun::next`, and the `_` arm of `Uslp::parse`. None is reachable (GEN-020)."

[[waiver]]
crate = "aldis-link"
metric = "branches"
count = 10
justification = "src/generator.rs, src/extractor.rs — the branches of the same unreachable error returns: the `else` of `let Some(&first) = held.first()` in `look` and `emit`, the `let Length::Total(total) = packet::length(..) else` of `pull_from_queue`, the `?` of `Actions::push` and `Cx::write`, and the `get` of the octet-by-octet shift of the queue (an index below the queue length). None is reachable (GEN-020)."
