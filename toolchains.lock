# Pinned toolchains for verification (VER-056).
#
# Shared toolchain versions read by Containerfile and setup_cpp.py.
# Format: one KEY=VALUE per line, no quotes, no spaces around '='. Lines starting with '#' are
# comments. An archive is <NAME>_<ARCH>_URL with <NAME>_<ARCH>_SHA256, ARCH being X64 or ARM64
# (the runner's architecture). Changing any value is a configuration-controlled change.

# --- LLVM: clang, clang++, llvm-cov, llvm-profdata, llvm-nm ---
LLVM_VERSION=23.1.3
LLVM_X64_URL=https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.zst
LLVM_X64_SHA256=14d2f701eb68fb799001bdea6231048f3990690fa2f406d563555ff8f744daba
LLVM_ARM64_URL=https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-ARM64.tar.zst
LLVM_ARM64_SHA256=1154f37ec15b5654fcb8cc3a8a2352a4cc4eef44bdff7ddd47fb10ea85c82f01

# --- GCC (host): Ubuntu 24.04's gcc-14/g++-14 ---
# VERSION is what `g++-14 -dumpfullversion` prints; APT_VERSION is the exact package version.
GCC_VERSION=14.2.0
GCC_APT_PACKAGES=gcc-14 g++-14
GCC_APT_VERSION=14.2.0-4ubuntu2~24.04.1

# --- GCC (s390x cross, big-endian host tests under QEMU user mode) ---
GCC_S390X_VERSION=14.2.0
GCC_S390X_APT_PACKAGES=gcc-14-s390x-linux-gnu g++-14-s390x-linux-gnu
GCC_S390X_APT_VERSION=14.2.0-4ubuntu2~24.04.1cross1

# --- QEMU: bare-metal runs (system mode) and s390x tests (user mode) ---
QEMU_VERSION=8.2.2
QEMU_APT_PACKAGES=qemu-system-arm qemu-system-misc qemu-user
