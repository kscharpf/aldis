# --- QEMU: bare-metal runs (system mode) and s390x tests (user mode); D3, D6 ---
# Ubuntu 24.04 packages. QEMU runs the tests but compiles nothing, so the upstream version is
# asserted and the Ubuntu revision may float: Ubuntu replaces the revision in noble-updates,
# so an exact pin would break CI with every QEMU update, with no effect on what is verified.
QEMU_VERSION=8.2.2
QEMU_APT_PACKAGES=qemu-system-arm qemu-system-misc qemu-user

# --- CodeQL Coding Standards (AUTOSAR C++14, CERT C++); D13, CPP-043, OI-22 ---
# The packs' release names the CLI version they support (2.21.4); the CLI comes from the
# matching CodeQL bundle, which also holds the standard C++ library pack. x86_64 Linux only.
# Free for this repository because it is public and OSI-licensed (MIT), as OI-22 records.
CODEQL_VERSION=2.21.4
