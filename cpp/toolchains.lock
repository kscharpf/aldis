# Pinned C++ toolchains (docs/milestones/c0-foundations.md D1, D2, D13; CPP-001, CPP-003, VER-055).
#
# The single source of every C++ tool version. Read by .github/actions/setup-cpp, which installs
# exactly these versions (archives verified by SHA-256, apt packages by exact version) and fails
# on any difference, and by cpp/cmake/AldisToolchainCheck.cmake, which fails a configure whose
# compiler version differs from <NAME>_VERSION below.
#
# Format: one KEY=VALUE per line, no quotes, no spaces around '='. Lines starting with '#' are
# comments. An archive is <NAME>_<ARCH>_URL with <NAME>_<ARCH>_SHA256, ARCH being X64 or ARM64
# (the runner's architecture); a tool without an entry for an architecture is not available
# there. Changing any value is a configuration-controlled change (CPP-001): its own PR, with a
# changelog fragment.

# --- LLVM: clang, clang++, clang-tidy, clang-format, lld, llvm-cov, llvm-profdata, llvm-nm ---
# One major version for host and bare-metal builds (D1). Major 23 matches the LLVM of Rust
# 1.99.1 (RS-001), which CPP-061 needs for the differential fuzz targets. Official release
# tarballs; GitHub's asset digests. The archives use a 1 GiB zstd window (`zstd --long=31`).
LLVM_VERSION=23.1.3
LLVM_X64_URL=https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.zst
LLVM_X64_SHA256=14d2f701eb68fb799001bdea6231048f3990690fa2f406d563555ff8f744daba
LLVM_ARM64_URL=https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-ARM64.tar.zst
LLVM_ARM64_SHA256=1154f37ec15b5654fcb8cc3a8a2352a4cc4eef44bdff7ddd47fb10ea85c82f01

# --- GCC (host): Ubuntu 24.04's gcc-14/g++-14 (D1) ---
# VERSION is what `g++-14 -dumpfullversion` prints; APT_VERSION is the exact package version.
GCC_VERSION=14.2.0
GCC_APT_PACKAGES=gcc-14 g++-14
GCC_APT_VERSION=14.2.0-4ubuntu2~24.04.1

# --- GCC (s390x cross, big-endian host tests under QEMU user mode; D3) ---
GCC_S390X_VERSION=14.2.0
GCC_S390X_APT_PACKAGES=gcc-14-s390x-linux-gnu g++-14-s390x-linux-gnu
GCC_S390X_APT_VERSION=14.2.0-4ubuntu2~24.04.1cross1

# --- Arm GNU Toolchain (arm-none-eabi): Cortex-M4F and Cortex-R5F (D2) ---
# Checksums from Arm's published .sha256asc files.
ARM_GNU_RELEASE=14.3.rel1
ARM_GNU_VERSION=14.3.1
ARM_GNU_X64_URL=https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
ARM_GNU_X64_SHA256=8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd
ARM_GNU_ARM64_URL=https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-aarch64-arm-none-eabi.tar.xz
ARM_GNU_ARM64_SHA256=2d465847eb1d05f876270494f51034de9ace9abe87a4222d079f3360240184d3

# --- xPack GNU RISC-V Embedded GCC (riscv-none-elf): rv32imac (D2) ---
