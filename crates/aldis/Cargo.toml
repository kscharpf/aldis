[package]
name = "aldis"
description = "Facade re-exporting the Aldis crates behind feature flags"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aldis-core = { path = "../aldis-core", default-features = false, optional = true }
aldis-time = { path = "../aldis-time", default-features = false, optional = true }
aldis-spp = { path = "../aldis-spp", default-features = false, optional = true }
aldis-epp = { path = "../aldis-epp", default-features = false, optional = true }
aldis-tm = { path = "../aldis-tm", default-features = false, optional = true }
aldis-tc = { path = "../aldis-tc", default-features = false, optional = true }
aldis-aos = { path = "../aldis-aos", default-features = false, optional = true }
aldis-uslp = { path = "../aldis-uslp", default-features = false, optional = true }
aldis-link = { path = "../aldis-link", default-features = false, optional = true }
aldis-cop1 = { path = "../aldis-cop1", default-features = false, optional = true }
aldis-framework = { path = "../aldis-framework", default-features = false, optional = true }

[features]
core = ["dep:aldis-core"]
time = ["dep:aldis-time"]
spp = ["dep:aldis-spp"]
epp = ["dep:aldis-epp"]
# The typed time secondary header of the Space Packet (SPP-008): `spp` and `time`, plus
# `aldis-spp/time`, without `full`.
spp-time = ["spp", "time", "aldis-spp/time"]
tm = ["dep:aldis-tm"]
tc = ["dep:aldis-tc"]
aos = ["dep:aldis-aos"]
uslp = ["dep:aldis-uslp"]
link = ["dep:aldis-link"]
cop1 = ["dep:aldis-cop1"]
framework = ["dep:aldis-framework"]
alloc = [
    "aldis-core?/alloc",
    "aldis-time?/alloc",
    "aldis-spp?/alloc",
    "aldis-epp?/alloc",
    "aldis-tm?/alloc",
    "aldis-tc?/alloc",
    "aldis-aos?/alloc",
    "aldis-uslp?/alloc",
    "aldis-link?/alloc",
    "aldis-cop1?/alloc",
    "aldis-framework?/alloc",
]
std = [
    "alloc",
    "aldis-core?/std",
    "aldis-time?/std",
    "aldis-spp?/std",
    "aldis-epp?/std",
    "aldis-tm?/std",
    "aldis-tc?/std",
    "aldis-aos?/std",
    "aldis-uslp?/std",
    "aldis-link?/std",
    "aldis-cop1?/std",
    "aldis-framework?/std",
]
full = [
    "core",
    "time",
    "spp",
    "spp-time",
    "epp",
    "tm",
    "tc",
    "aos",
    "uslp",
    "link",
    "aldis-link/spp",
    "aldis-link/epp",
    "aldis-link/tm",
    "aldis-link/tc",
    "aldis-link/aos",
    "aldis-link/uslp",
    "cop1",
    "aldis-cop1/tc",
    "aldis-cop1/uslp",
    "framework",
]

[lints]
workspace = true
