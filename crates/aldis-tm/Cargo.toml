[package]
name = "aldis-tm"
description = "CCSDS 132.0-B-3 TM Space Data Link Protocol frame codec"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aldis-core = { path = "../aldis-core", default-features = false }

[features]
alloc = ["aldis-core/alloc"]
std = ["alloc", "aldis-core/std"]

[lints]
workspace = true

[dev-dependencies]
# The pre-filled test hook (API-073) for tests that fill the Security fields by hand (RS-023).
aldis-core = { path = "../aldis-core", default-features = false, features = ["test-hooks"] }
aldis-testkit = { path = "../aldis-testkit", features = ["strategies-tm"] }
serde_json = "1.0.154"
