[package]
name = "aldis-uslp"
description = "CCSDS 732.1-B-3 Unified Space Data Link Protocol frame codec"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aldis-core = { path = "../aldis-core", default-features = false }

[features]
alloc = ["aldis-core/alloc"]
std = ["alloc", "aldis-core/std"]

[lints]
workspace = true

[dev-dependencies]
aldis-testkit = { path = "../aldis-testkit" }
serde_json = "1.0.154"
# USLP-013: a TFDZ of COP-1 control commands decodes with the TC control-command decoder; a
# dev-dependency only, so GEN-002 holds for the library (M2 plan D8, OI-34).
aldis-tc = { path = "../aldis-tc", default-features = false }
