[package]
name = "aldis-testkit"
description = "Test-vector model, loader, and runner shared by all Aldis test suites (tooling, dev-only)"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
schemars = { version = "1.2.3", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Shared property-test strategies (features `strategies*`, VER-054, M2 D6). The codec crates are
# normal dependencies of this tooling crate (RS-017), without default features, and without the
# `time` feature of aldis-spp: features enabled here would be enabled in every test build of the
# crates that dev-depend on this one (GEN-006). One feature per codec crate, so that a crate's
# tests link only the crates they test: aldis-core's coverage would otherwise count the code that
# its macros expand to in the other crates (VER-024).
aldis-core = { path = "../aldis-core", default-features = false, optional = true }
aldis-time = { path = "../aldis-time", default-features = false, optional = true }
aldis-spp = { path = "../aldis-spp", default-features = false, optional = true }
aldis-epp = { path = "../aldis-epp", default-features = false, optional = true }
aldis-tm = { path = "../aldis-tm", default-features = false, optional = true }
aldis-tc = { path = "../aldis-tc", default-features = false, optional = true }
aldis-aos = { path = "../aldis-aos", default-features = false, optional = true }
aldis-uslp = { path = "../aldis-uslp", default-features = false, optional = true }
proptest = { version = "1.12.0", optional = true }

[features]
# JSON Schema generation for the vector model (used by xtask).
schema = ["dep:schemars"]
# Property-test strategies (`aldis_testkit::strategies`, VER-054): `strategies` for the module
# and the aldis-core strategies, one more feature per codec crate.
strategies = ["dep:aldis-core", "dep:proptest"]
strategies-time = ["strategies", "dep:aldis-time"]
strategies-spp = ["strategies", "dep:aldis-spp"]
strategies-epp = ["strategies", "dep:aldis-epp"]
strategies-tm = ["strategies", "dep:aldis-tm"]
strategies-tc = ["strategies", "dep:aldis-tc"]
strategies-aos = ["strategies", "dep:aldis-aos"]
strategies-uslp = ["strategies", "dep:aldis-uslp"]

# Tooling lint profile (docs/profiles/rust.md RS-017): all + pedantic, no flight-code
# restriction lints; tests and tools fail loudly by design.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Selected nursery lints (RS-019). The nursery group itself stays off.
missing_const_for_fn = "deny"
derive_partial_eq_without_eq = "deny"
too_long_first_doc_paragraph = "deny"
redundant_clone = "deny"
