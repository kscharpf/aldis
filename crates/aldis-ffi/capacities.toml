# Build-time engine capacities for the C ABI (CABI-030, GEN-011).
# These become ALDIS_*_MAX_* constants in the generated header.

[fop1]
sent_queue_frames = 16     # >= FOP sliding window K (COP-015)
max_frame_octets = 1024    # TC maximum (232.0 §4.1.2.7)

[link]
# The link engines of aldis-link share this section (M4 WP-3, WP-4; the handles are built in WP-7a to WP-7d):
# the ChannelMux holds `max_virtual_channels` VC slots of `max_frame_octets` each; the packet,
# SDU, and bit queues of the PacketGenerator, the PacketExtractor, the AccessGenerator, and the
# BitstreamGenerator hold `packet_queue_octets`. The MapSegmenter's queue is `packet_queue_octets`
# too, the MapReassembler holds `max_map_channels` assembly buffers of `max_frame_octets`, and the
# CltuPacker's unit holds `max_frame_octets` (M4 WP-6).
# The engines are built in place in the caller's storage (`aldis::link::inplace`, #240), so these
# sizes do not pass through the stack: 8192 octets of queue and 2048 of data field (a 1115-octet
# TM or AOS frame fits).
max_virtual_channels = 8
max_map_channels = 16
packet_queue_octets = 8192
max_frame_octets = 2048

[spp]
tracker_max_apids = 16     # APIDs one aldis_spp_tracker_t tracks (SPP-011, M2 plan D5)

# --- TC (M2 WP-3 module 8)
[tc]
max_maps = 64             # MAPs one aldis_tc_* call takes with a master channel (232.0 Table 5-4, M2 plan D14)

# ---- USLP (M2 WP-5 module 9) ----
[uslp]
max_vcs = 16               # virtual channels in one aldis_uslp_* channel table (API-040, M2 plan D14)
max_maps = 32              # MAP channels in one aldis_uslp_* channel table (API-040, M2 plan D14)

[sync]
# The ASM search handle `aldis_sync_search_t` (M5 WP-4, SYNC-002, SYNC-013, SYNC-014): the engine is
# built in place in the caller's storage (`aldis::sync::AsmSearch`, issue #240 pattern), so
# `max_frame_octets` octets of partial unit do not pass through the stack. 65536 is the largest
# frame of AOS and fixed-length USLP (131.0 §11.3, §11.4; TM stops at 2048), so no valid frame length
# exceeds the capacity. A chunk is at most `max_chunk_octets` octets (`chunk_len`, SYNC-014); the
# output area that fits every chunk is `max_chunk_octets + max_frame_octets` octets.
max_chunk_octets = 256
max_frame_octets = 65536
