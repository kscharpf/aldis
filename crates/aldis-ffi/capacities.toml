# Build-time engine capacities for the C ABI (CABI-030, GEN-011).
# These become ALDIS_*_MAX_* constants in the generated header.

[fop1]
sent_queue_frames = 16     # >= FOP sliding window K (COP-015)
max_frame_octets = 1024    # TC maximum (232.0 §4.1.2.7)

[farm1]
delivery_queue_depth = 4

[link]
max_virtual_channels = 8
max_map_channels = 16
packet_queue_octets = 8192
max_frame_octets = 2048
