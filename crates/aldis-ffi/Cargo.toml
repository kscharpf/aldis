[package]
name = "aldis-ffi"
description = "C ABI for Aldis"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
aldis = { path = "../aldis", default-features = false, features = ["full"] }

[dev-dependencies]
aldis-testkit = { path = "../aldis-testkit" }
serde_json = "1.0.154"

[features]
default = ["std"]
# Hosted builds (ground). Embedded builds use --no-default-features --features panic-handler.
std = ["aldis/std"]
# Provides a minimal #[panic_handler] for no_std staticlib builds. GEN-020/VER-010 require
# that no panic path is reachable, so this handler only satisfies the linker.
panic-handler = []
# A #[panic_handler] that calls the undefined symbol `aldis_panic_is_unreachable`, for the
# exerciser's panic-freedom link check (VER-010, M2 plan D16). Not for integrators.
panic-unreachable = []

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
as_conversions = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
alloc_instead_of_core = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
string_slice = "deny"
infinite_loop = "deny"
mem_forget = "deny"
as_pointer_underscore = "deny"
lossy_float_literal = "deny"
# Selected nursery lints (RS-019). The nursery group itself stays off.
missing_const_for_fn = "deny"
derive_partial_eq_without_eq = "deny"
too_long_first_doc_paragraph = "deny"
redundant_clone = "deny"
fallible_impl_from = "deny"
non_send_fields_in_send_ty = "deny"
transmute_undefined_repr = "deny"
debug_assert_with_mut_call = "deny"
needless_pass_by_ref_mut = "deny"
large_stack_frames = "deny"
collection_is_never_read = "deny"
