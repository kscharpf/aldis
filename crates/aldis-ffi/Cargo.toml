[package]
name = "aldis-ffi"
description = "C ABI for Aldis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
aldis = { path = "../aldis", default-features = false, features = ["full"] }

[features]
default = ["std"]
# Hosted builds (ground). Embedded builds use --no-default-features --features panic-handler.
std = ["aldis/std"]
# Provides a minimal #[panic_handler] for no_std staticlib builds. GEN-020/VER-010 require
# that no panic path is reachable, so this handler only satisfies the linker.
panic-handler = []

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
as_conversions = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
