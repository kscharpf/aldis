# cbindgen configuration (CABI-002, CABI-003). The pinned cbindgen (`xtask/src/header.rs`,
# `xtask/verify/Containerfile`) generates `include/aldis/aldis.h` with
#   cargo xtask header --write
# and `cargo xtask header` (verify check `header`) fails when the committed header differs.
language = "C"
cpp_compat = true
include_guard = "ALDIS_H"
autogen_warning = "/* Generated by cbindgen from crates/aldis-ffi (`cargo xtask header --write`). Do not edit. */"
sys_includes = ["stdint.h", "stddef.h", "stdbool.h"]
no_includes = true
style = "type"
usize_is_size_t = true

[parse]
parse_deps = false

[export]
prefix = ""
# The mirror enums of `src/mirror.rs`: no function or struct names them, because a field stays a
# fixed-width integer (OI-57 convention 2), so cbindgen is told to emit them.
include = [
    "aldis_access_generator_action",
    "aldis_access_generator_input",
    "aldis_aos_content",
    "aldis_aos_edition",
    "aldis_aos_pointer",
    "aldis_bitstream_generator_action",
    "aldis_bitstream_generator_input",
    "aldis_farm1_action",
    "aldis_farm1_fdu",
    "aldis_farm1_input",
    "aldis_fop1_action",
    "aldis_fop1_alert",
    "aldis_fop1_directive",
    "aldis_fop1_frame",
    "aldis_fop1_input",
    "aldis_fop1_notice",
    "aldis_fop1_timeout",
    "aldis_frame_receiver_action",
    "aldis_frame_receiver_input",
    "aldis_link_content",
    "aldis_link_discard",
    "aldis_link_idle_packet",
    "aldis_link_idle_policy",
    "aldis_link_protocol",
    "aldis_link_qos",
    "aldis_link_scope",
    "aldis_link_service",
    "aldis_mode",
    "aldis_ocf_report",
    "aldis_oid_form",
    "aldis_packet_extractor_action",
    "aldis_packet_extractor_error",
    "aldis_packet_extractor_input",
    "aldis_packet_generator_action",
    "aldis_packet_generator_input",
    "aldis_spp_discard",
    "aldis_spp_packet_type",
    "aldis_spp_reassembly",
    "aldis_spp_secondary",
    "aldis_spp_sequence_flags",
    "aldis_spp_track",
    "aldis_status",
    "aldis_tc_control",
    "aldis_tc_discard",
    "aldis_tc_frame",
    "aldis_tc_sequence_flags",
    "aldis_tc_stream",
    "aldis_time_ccs_variation",
    "aldis_time_cds_day",
    "aldis_time_cds_submillis",
    "aldis_time_code",
    "aldis_tm_content",
    "aldis_tm_pointer",
    "aldis_uslp_direction",
    "aldis_uslp_discard",
