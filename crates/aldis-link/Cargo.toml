[package]
name = "aldis-link"
description = "Sans-I/O sending and receiving engines for CCSDS packets and frames"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aldis-core = { path = "../aldis-core", default-features = false }
aldis-spp = { path = "../aldis-spp", default-features = false, optional = true }
aldis-epp = { path = "../aldis-epp", default-features = false, optional = true }
aldis-tm = { path = "../aldis-tm", default-features = false, optional = true }
aldis-tc = { path = "../aldis-tc", default-features = false, optional = true }
aldis-aos = { path = "../aldis-aos", default-features = false, optional = true }
aldis-uslp = { path = "../aldis-uslp", default-features = false, optional = true }

[features]
spp = ["dep:aldis-spp"]
epp = ["dep:aldis-epp"]
tm = ["dep:aldis-tm"]
tc = ["dep:aldis-tc"]
aos = ["dep:aldis-aos"]
uslp = ["dep:aldis-uslp"]
alloc = [
    "aldis-core/alloc",
    "aldis-spp?/alloc",
    "aldis-epp?/alloc",
    "aldis-tm?/alloc",
    "aldis-tc?/alloc",
    "aldis-aos?/alloc",
    "aldis-uslp?/alloc",
]
std = [
    "alloc",
    "aldis-core/std",
    "aldis-spp?/std",
    "aldis-epp?/std",
    "aldis-tm?/std",
    "aldis-tc?/std",
    "aldis-aos?/std",
    "aldis-uslp?/std",
]

[lints]
workspace = true

[dev-dependencies]
aldis-cop1 = { path = "../aldis-cop1", default-features = false, features = ["tc", "uslp"] }
aldis-testkit = { path = "../aldis-testkit", features = ["strategies"] }
serde_json = "1.0.154"

# The vector runners and the property tests drive the engines of every protocol (M4 WP-3).
[[test]]
name = "packet_generator_vectors"
required-features = ["spp", "epp", "tm", "aos", "uslp"]

[[test]]
name = "packet_extractor_vectors"
required-features = ["spp", "epp", "tm", "aos", "uslp"]

[[test]]
name = "packet_roundtrip"
required-features = ["spp", "epp", "tm", "aos", "uslp"]

[[test]]
name = "engine_housekeeping"
required-features = ["spp", "epp", "tm", "aos", "uslp"]

# The ChannelMux, the VC Access generator, and the AOS Bitstream generator (M4 WP-4).
[[test]]
name = "channel_mux_vectors"
required-features = ["tm", "aos", "uslp"]

[[test]]
name = "channel_mux_engine"
required-features = ["tm", "aos", "uslp"]

[[test]]
name = "generators_engine"
required-features = ["tm", "aos", "uslp"]

[[test]]
name = "access_generator_vectors"
required-features = ["tm", "aos", "uslp"]

[[test]]
name = "bitstream_generator_vectors"
required-features = ["aos"]

[[test]]
name = "frame_receiver_vectors"
required-features = ["spp", "epp", "tm", "tc", "aos", "uslp"]

[[test]]
name = "frame_receiver"
required-features = ["spp", "epp", "tm", "tc", "aos", "uslp"]

# The MapSegmenter, the MapReassembler, and the CLTU packer (M4 WP-6).
[[test]]
name = "map_segmenter_vectors"
required-features = ["spp", "epp", "tc", "uslp"]

[[test]]
name = "map_reassembler_vectors"
required-features = ["spp", "epp", "tc", "uslp"]

[[test]]
name = "map_segmenter_engine"
required-features = ["spp", "epp", "tc", "uslp"]

[[test]]
name = "map_reassembler_engine"
required-features = ["spp", "epp", "tc", "uslp"]

[[test]]
name = "cltu_packer"

[[test]]
name = "map_roundtrip"
required-features = ["spp", "epp", "tc", "uslp"]

# LNK-043: the FDUs of the segmenter are requests of FOP-1.
[[test]]
name = "segmenter_fop1"
required-features = ["spp", "epp", "tc", "uslp"]

# GEN-033, RS-013: every engine is `Send`, `Sync`, and `Clone` by construction.
[[test]]
name = "engine_contract"
required-features = ["spp", "epp", "tm", "tc", "aos", "uslp"]
