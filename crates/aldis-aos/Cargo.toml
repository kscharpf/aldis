[package]
name = "aldis-aos"
description = "CCSDS 732.0-B-5 AOS Space Data Link Protocol frame codec"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aldis-core = { path = "../aldis-core", default-features = false }

[features]
alloc = ["aldis-core/alloc"]
std = ["alloc", "aldis-core/std"]

[lints]
workspace = true

[dev-dependencies]
aldis-testkit = { path = "../aldis-testkit", features = ["strategies-aos"] }
serde_json = "1.0.154"
