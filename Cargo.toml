[workspace]
resolver = "3"
# Own workspaces: bare-metal exerciser (WP-5), cargo-fuzz targets (WP-6), independent
# cross-checks (M1 WP-4), and the reference application (track A, docs/reference-application.md).
exclude = ["crosscheck", "exerciser", "fuzz", "refapp"]
members = [
    "crates/aldis-core",
    "crates/aldis-time",
    "crates/aldis-spp",
    "crates/aldis-epp",
    "crates/aldis-tm",
    "crates/aldis-tc",
    "crates/aldis-aos",
    "crates/aldis-uslp",
    "crates/aldis-link",
    "crates/aldis-cop1",
    "crates/aldis-framework",
    "crates/aldis",
    "crates/aldis-ffi",
    # Tooling (std, dev-only; not part of the layered library)
    "crates/aldis-testkit",
    "xtask",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99.1"        # RS-001: equals rust-toolchain.toml (OI-07)
license = "MIT OR Apache-2.0"  # OI-01 (resolved; dual since 2026-10-24)
repository = "https://github.com/kscharpf/aldis"

# Lint set required by docs/profiles/rust.md §5 and docs/06-verification.md VER-001.
# aldis-ffi defines its own table (unsafe "deny" instead of "forbid", GEN-071).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"
# cargo-llvm-cov sets cfg(coverage_nightly) so test modules can be excluded from coverage (VER-024);
# `cargo kani` sets cfg(kani) for the proof harnesses (docs/verification/formal-proofs.md).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)", "cfg(kani)"] }

[workspace.lints.clippy]
# Lint groups first (lowest priority) so the individual lints below can refine them.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Selected restriction lints (GEN-010, GEN-020, GEN-030, GEN-070).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
as_conversions = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
alloc_instead_of_core = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
string_slice = "deny"
infinite_loop = "deny"
mem_forget = "deny"
as_pointer_underscore = "deny"
lossy_float_literal = "deny"
# Selected nursery lints (RS-019). The nursery group itself stays off.
missing_const_for_fn = "deny"
derive_partial_eq_without_eq = "deny"
too_long_first_doc_paragraph = "deny"
redundant_clone = "deny"
fallible_impl_from = "deny"
non_send_fields_in_send_ty = "deny"
transmute_undefined_repr = "deny"
debug_assert_with_mut_call = "deny"
needless_pass_by_ref_mut = "deny"
large_stack_frames = "deny"
collection_is_never_read = "deny"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
