# Instance of the AINT interoperability run (written by this project; reference-application.md §11.3).
# The TM frame link and the TC frame link with COP-1 of §11.1 (WP-3, WP-4). The mission database holds
# the commands of the scenario only (mdb/aldis.xml): the telemetry packets are archived and indexed,
# not decoded into parameters.
# Public documentation: https://docs.yamcs.org/yamcs-server-manual/links/ccsds-frame-processing/
services:
  - class: org.yamcs.archive.CcsdsTmIndex
  - class: org.yamcs.archive.CommandHistoryRecorder
  - class: org.yamcs.ProcessorCreatorService
    args:
      name: realtime
      type: realtime

mdb:
  - type: xtce
    spec: etc/mdb/aldis.xml

streamConfig:
  tm:
    - name: tm_vc0
    - name: tm_vc1
    - name: tm_vc7
  tc:
    - name: tc_realtime
      processor: realtime
  event: [events_realtime]
  cmdHist: [cmdhist_realtime]
  param: [pp_realtime, sys_param]
  sqlFile: etc/aldis-streams.sql

dataLinks:
  - name: aldis-tm
    class: org.yamcs.tctm.ccsds.UdpTmFrameLink
    port: 10015
    frameType: TM
    spacecraftId: 0x155
    frameLength: 223
    errorDetection: CRC16
    clcwStream: clcw
    goodFrameStream: good_frames
    badFrameStream: bad_frames
    virtualChannels:
      # VC 0: housekeeping 0x010 (implicit P-field) and events 0x011 (explicit P-field), so the
      # time stamp is not read from the packet (a preprocessor reads one offset per VC).
      - vcId: 0
        ocfPresent: true
        service: PACKET
        maxPacketLength: 512
        stream: tm_vc0
        packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
        packetPreprocessorArgs:
          timestampOffset: -1
          seqCountOffset: 0
      # VC 1: payload 0x020 and dump 0x021, both with the implicit P-field: CUC 4+2 octets
      # (reference-application.md §3.2, §5): epoch 1958-01-01 TAI, P-field 0x2E implied.
      - vcId: 1
        ocfPresent: true
        service: PACKET
        maxPacketLength: 512
        stream: tm_vc1
        packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
        packetPreprocessorArgs:
          timestampOffset: 6
          seqCountOffset: 0
          timeEncoding:
            type: CUC
            implicitPField: 0x2E
            epoch: TAI
      # VC 7: OID frames only (§4.1); no packets expected.
      - vcId: 7
        ocfPresent: true
        service: PACKET
        maxPacketLength: 512
        stream: tm_vc7
        packetPreprocessorClassName: org.yamcs.tctm.GenericPacketPreprocessor
        packetPreprocessorArgs:
          timestampOffset: -1
          seqCountOffset: 0

  # TC link (WP-4): VC 0, MAP service on, COP-1 with K = 4, T1 = 1 s (whole seconds), no CLTU
  # (no cltuEncoding, APP-006), one frame per datagram (APP-159). The driver listens on UDP
  # 10025 of the host; the container reaches the host as host.containers.internal.
  - name: aldis-tc
    class: org.yamcs.tctm.ccsds.UdpTcFrameLink
    host: host.containers.internal
    port: 10025
    spacecraftId: 0x155
    maxFrameLength: 128
    errorDetection: CRC16
    priorityScheme: FIFO
    virtualChannels:
      - vcId: 0
        service: PACKET
        mapId: 0
        commandPostprocessorClassName: org.yamcs.tctm.GenericCommandPostprocessor
        stream: tc_realtime
        useCop1: true
        clcwStream: clcw
        initialClcwWait: 0
        slidingWindowWidth: 4
        cop1T1: 1
        cop1TxLimit: 3
