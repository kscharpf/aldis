[package]
name = "refapp-qemu"
description = "Bare-metal Cortex-M4F flight node for QEMU (APP-004, APP-102)"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

# Separate workspace: a no_std/no_main binary cannot be built for the host, so it is not a
# member of refapp/Cargo.toml (same pattern as exerciser/).
[workspace]

[[bin]]
name = "refapp-qemu"
path = "src/main.rs"
test = false
bench = false

[dependencies]
refapp-flight = { path = "../refapp-flight" }
refapp-scenario = { path = "../refapp-scenario" }

[features]
# Canary: plants a reachable panic so CI can prove the panic-freedom link check fails when it should.
inject-panic = []

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"

[profile.dev]
panic = "abort"

[lints.rust]
# Startup vector table, CMSDK UART0 MMIO, semihosting `bkpt`, and static state need unsafe;
# each use carries #[expect] and a SAFETY comment.
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
as_conversions = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
alloc_instead_of_core = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
string_slice = "deny"
infinite_loop = "deny"
mem_forget = "deny"
as_pointer_underscore = "deny"
lossy_float_literal = "deny"
allow_attributes = "deny"
wildcard_enum_match_arm = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"
unnecessary_rest_pattern = "deny"
shadow_same = "deny"
excessive_nesting = "deny"
else_if_without_else = "deny"
# Selected nursery lints (RS-019). The nursery group itself stays off.
missing_const_for_fn = "deny"
derive_partial_eq_without_eq = "deny"
too_long_first_doc_paragraph = "deny"
redundant_clone = "deny"
fallible_impl_from = "deny"
non_send_fields_in_send_ty = "deny"
transmute_undefined_repr = "deny"
debug_assert_with_mut_call = "deny"
needless_pass_by_ref_mut = "deny"
large_stack_frames = "deny"
collection_is_never_read = "deny"
use_self = "deny"
