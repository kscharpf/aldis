[package]
name = "refapp-interop"
description = "Reference application: transport driver that steps the flight node against a UDP socket and a clock (AINT)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Standard library and the workspace's own crates only: no third-party dependency (plan D4).
[dependencies]
refapp-flight = { workspace = true }
refapp-ground = { workspace = true }
refapp-harness = { workspace = true }
refapp-scenario = { workspace = true }

# Tooling lint profile (RS-017, APP-104).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Selected nursery lints (RS-019). The nursery group itself stays off.
missing_const_for_fn = "deny"
derive_partial_eq_without_eq = "deny"
too_long_first_doc_paragraph = "deny"
redundant_clone = "deny"
fallible_impl_from = "deny"
non_send_fields_in_send_ty = "deny"
transmute_undefined_repr = "deny"
debug_assert_with_mut_call = "deny"
needless_pass_by_ref_mut = "deny"
large_stack_frames = "deny"
collection_is_never_read = "deny"
