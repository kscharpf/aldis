[package]
name = "xtask-ci"
description = "Project tooling for Aldis: cargo xtask ci, the checks CI runs without a C++ build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
xtask-changelog = { path = "../changelog" }
xtask-cpp = { path = "../cpp" }
xtask-layers = { path = "../layers" }
xtask-lib = { path = "../lib" }
xtask-spec = { path = "../spec" }

# Tooling lint profile (RS-017).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Selected nursery lints (RS-019). The nursery group itself stays off.
missing_const_for_fn = "deny"
derive_partial_eq_without_eq = "deny"
too_long_first_doc_paragraph = "deny"
redundant_clone = "deny"
