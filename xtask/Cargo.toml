[package]
name = "xtask"
description = "Project tooling for Aldis: spec lint, traceability, vectors, links, layering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aldis-testkit = { path = "../crates/aldis-testkit", features = ["schema"] }
# The codec crates, without default features, for `xtask layouts`, which derives the header
# layouts by probing their encoders (VER-072).
aldis-core = { path = "../crates/aldis-core", default-features = false }
aldis-time = { path = "../crates/aldis-time", default-features = false }
aldis-spp = { path = "../crates/aldis-spp", default-features = false }
aldis-epp = { path = "../crates/aldis-epp", default-features = false }
aldis-tm = { path = "../crates/aldis-tm", default-features = false }
aldis-tc = { path = "../crates/aldis-tc", default-features = false }
aldis-aos = { path = "../crates/aldis-aos", default-features = false }
aldis-uslp = { path = "../crates/aldis-uslp", default-features = false }
serde_json = "1.0.154"
sha2 = "0.11.1"

# Tooling lint profile (RS-017).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
allow_attributes = "deny"
wildcard_enum_match_arm = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"
unnecessary_rest_pattern = "deny"
shadow_same = "deny"
excessive_nesting = "deny"
else_if_without_else = "allow"
# Selected nursery lints (RS-019). The nursery group itself stays off.
missing_const_for_fn = "deny"
derive_partial_eq_without_eq = "deny"
too_long_first_doc_paragraph = "deny"
redundant_clone = "deny"
fallible_impl_from = "deny"
non_send_fields_in_send_ty = "deny"
transmute_undefined_repr = "deny"
debug_assert_with_mut_call = "deny"
needless_pass_by_ref_mut = "deny"
large_stack_frames = "deny"
collection_is_never_read = "deny"
