# RS-020 exemptions, checked by `cargo xtask rs020` (part of `cargo xtask ci`).
#
# The check flags every bare integer (`u8` ... `u128`, `usize`, `i8` ... `isize`, also inside
# `Option` or a tuple) in a public field or enum payload of a codec crate. RS-020 requires a field
# with a restricted range to be a type that enforces it; a finding that is not such a gap is
# listed here, with the reason. An exemption without a reason, listed twice, or that no longer
# matches a finding fails the check, so this list is exactly the set of bare integers left.
#
# [[exemption]]
# item = "aldis_x::module::Type.field"        # or Type::Variant.0 for an enum payload
# reason = "why the integer has no range of its own that a type could enforce"
#
# Reasons used below:
# - full width: every value of the integer is valid;
# - relation: the value's only bound is its fit to another value (a format, a configuration,
#   a frame), which the constructor or writer checks, as RS-020 allows;
# - output: a length, count, or diagnostic the crate reports and no function takes back;
# - pending: a gap whose fix waits for a maintainer decision.

# aldis-core

[[exemption]]
item = "aldis_core::counter::Continuity::Gap.missing"
reason = "output: the number of counts skipped, computed by the classify functions of ModCounter, SeqCount, and FrameSeqNum; no function takes a Continuity back (CMN-031)"

[[exemption]]
item = "aldis_core::error::ErrorDetail::Expected.expected"
reason = "output: a diagnostic value of an error, the value or limit expected; any u64 is meaningful (GEN-041)"

[[exemption]]
item = "aldis_core::error::ErrorDetail::Expected.found"
reason = "output: a diagnostic value of an error, the value found; any u64 is meaningful (GEN-041)"

[[exemption]]
item = "aldis_core::error::ErrorDetail::Needed.0"
reason = "output: a diagnostic count of the octets or bits needed; any usize is meaningful (GEN-041)"

[[exemption]]
item = "aldis_core::layout::LayoutSpec.frame_len"
reason = "relation: a length in octets with no range beyond usize; FrameLayout::compute checks that the lengths leave a data field (CMN-041)"

[[exemption]]
item = "aldis_core::layout::LayoutSpec.primary_header_len"
reason = "relation: a length in octets with no range beyond usize; FrameLayout::compute checks that the lengths leave a data field (CMN-041)"

[[exemption]]
item = "aldis_core::layout::LayoutSpec.secondary_len"
reason = "relation: a length in octets with no range beyond usize; FrameLayout::compute checks that the lengths leave a data field (CMN-041)"

