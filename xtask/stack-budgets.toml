# Stack budgets and exemptions, checked by `cargo xtask stack` (the verify check `stack`; VER-011,
# GEN-022, M2 plan WP-7). xtask/src/stack.rs says how the worst case is computed.
#
# [[budget]]: per bare-metal target, the most stack in bytes that one call of an entry point may
# use, for the Rust entry points (`rust`) and the C ABI functions (`c-abi`). The values are the
# maintainer's (docs/process/decisions.md, 2026-10-24, #113), revisited at the M2 exit.
#
# [[exemption]]: a function at which the call graph is incomplete, with a stated bound and the
# reason. `frame = <bytes>`: the function is assembly, with no `.stack_sizes` entry and no IR;
# the bound is its own frame, read from its disassembly, and its direct calls stay in the graph.
# `indirect = <bytes>`: the function makes indirect calls itself; the bound is what they may
# take, added to its worst case. It accepts only that function's own indirect calls: not its
# callees', and not inline assembly. `targets` limits an exemption to some targets. An exemption
# that applies to nothing on one of its targets fails the check.

[[budget]]
target = "thumbv7em-none-eabihf"
rust = 1024
c-abi = 10240

[[budget]]
target = "armv7r-none-eabihf"
rust = 1024
c-abi = 10240

[[budget]]
target = "riscv32imac-unknown-none-elf"
rust = 1024
c-abi = 10240

# The `Display` implementation of `aldis_core::Error` writes through `core::fmt`, whose
# `Formatter` calls the caller's `core::fmt::Write` implementation through a `dyn` reference in
# these four functions. That writer is the caller's code, so its stack is the caller's to bound:
# the library's own part is in the worst case, the writer is not (0 bytes). The `aldis_core`
# code under `Error as Display` stays fully checked.
[[exemption]]
function = "core::fmt::write"
indirect = 0
reason = "its indirect calls go to the caller's own core::fmt::Write implementation, outside the library; its stack is the caller's"

[[exemption]]
function = "<core::fmt::Formatter>::pad"
indirect = 0
reason = "its indirect calls go to the caller's own core::fmt::Write implementation, outside the library; its stack is the caller's"

[[exemption]]
function = "<core::fmt::Formatter>::pad_integral"
indirect = 0
reason = "its indirect calls go to the caller's own core::fmt::Write implementation, outside the library; its stack is the caller's"

[[exemption]]
function = "<core::fmt::Formatter>::pad_integral::write_prefix"
indirect = 0
reason = "its indirect calls go to the caller's own core::fmt::Write implementation, outside the library; its stack is the caller's"

[[exemption]]
function = "<core::fmt::Formatter>::padding"
indirect = 0
reason = "its indirect calls go to the caller's own core::fmt::Write implementation, outside the library; its stack is the caller's"

# The `Debug` implementation of `aldis_core::AnomalySet<A>` writes a set with
# `core::fmt::builders`, whose functions call the caller's writer, and the `Debug` of each entry,
# through `dyn` references. Each entry is an `A`, the anomaly type the set is instantiated with:
# the caller's type, or a codec's anomaly enum, whose derived `Debug` writes the variant's name to
# the same writer. Neither is counted (0 bytes), as for `Display`.
[[exemption]]
function = "<core::fmt::Formatter>::debug_set"
indirect = 0
reason = "its indirect call goes to the caller's own core::fmt::Write implementation, outside the library; its stack is the caller's"

[[exemption]]
function = "<core::fmt::builders::DebugSet>::finish"
indirect = 0
reason = "its indirect call goes to the caller's own core::fmt::Write implementation, outside the library; its stack is the caller's"

[[exemption]]
function = "<core::fmt::builders::DebugInner>::entry"
indirect = 0
reason = "its indirect calls go to the caller's writer and to the Debug implementation of the entry type A that the caller instantiates the set with; neither stack is counted"

# `__aeabi_uldivmod`, the 64-bit unsigned division of the ARM EABI, is hand-written assembly in
# `compiler_builtins` (`src/arm.rs`): `push {r4, lr}` (8 bytes) and `sub sp, sp, #16` (16), then
# one direct call of `__udivmoddi4` (a relocation, so it stays in the graph), and no other call.
[[exemption]]
function = "__aeabi_uldivmod"
targets = ["thumbv7em-none-eabihf", "armv7r-none-eabihf"]
frame = 24
reason = "assembly in compiler_builtins with a fixed frame of 24 bytes (push of r4 and lr, then 16 bytes for the remainder), read from its disassembly; its only call is __udivmoddi4, which the graph follows"
