[package]
name = "xtask-spec"
description = "Project tooling for Aldis: spec lint, traceability, test vectors, field catalogue, links"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aldis-testkit = { path = "../../crates/aldis-testkit", features = ["schema"] }
serde_json = "1.0.154"
xtask-lib = { path = "../lib" }

# Tooling lint profile (RS-017).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Selected nursery lints (RS-019). The nursery group itself stays off.
missing_const_for_fn = "deny"
derive_partial_eq_without_eq = "deny"
too_long_first_doc_paragraph = "deny"
redundant_clone = "deny"
