# The verification run on a GitHub-hosted runner, for a contributor who cannot run it locally
# (docs/06-verification.md §7, VER-060). Started only by hand, on a branch:
#
#   gh workflow run verify.yml --ref <branch>
#
# The run makes the checks of `cargo xtask verify` in parallel parts, one job per group of
# checks (VER-067), and assembles one record from them:
#
#   prepare   decides whether the run needs the verification image and makes sure the
#             registry has it
#   part      `cargo xtask verify part <group>` for host, cross, coverage, and embedded, side
#             by side; the first gating failure cancels the others; each uploads its part
#             record and logs, also when it failed
#   assemble  `cargo xtask verify assemble --publish`: refuses parts that do not fit
#             together, then judges and publishes the one record as any run's: a passing
#             record is published under refs/notes/verify and sets the commit status
#             aldis/verify, linked to this run (VER-057, VER-058); if main moved during the
#             run, the record is published without the status, so that the merge from main
#             can reuse it
#
# The verification image comes from ghcr.io/kscharpf/aldis-verify when a workflow of this
# repository has pushed it for the same image inputs (tag `<input hash>-amd64`), and its labels
# hold; otherwise `prepare` builds it and pushes it (`verify image --push`, VER-060), and the
# parts only pull it. The record names the image's source and digest, or, when no gating check
# needed the container, that no image was used. The first push creates the package as private:
# make it public once, under the package's settings (Package settings, Danger Zone, Change
# visibility), and check that "Manage Actions access" gives kscharpf/aldis the Write role.
name: verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  ALDIS_VERIFY_ENGINE: docker
  # Use the image this repository's workflows pushed, if its labels hold (VER-060).
  ALDIS_VERIFY_PULL: ghcr.io/kscharpf/aldis-verify

jobs:
  prepare:
    name: image (VER-060)
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # push the verification image to ghcr.io (VER-060)
    outputs:
      container: ${{ steps.plan.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: verify
      # Whether the run starts a container at all (VER-056): when the input rule skips or
      # reuses every gating check, no image is pulled or built.
      - name: Does the run need the image?
        id: plan
        run: |
          cargo xtask verify list | tee "$RUNNER_TEMP/plan.txt"
          if grep -q 'the run would start a container' "$RUNNER_TEMP/plan.txt"; then
            echo "container=true" >> "$GITHUB_OUTPUT"
          else
            echo "container=false" >> "$GITHUB_OUTPUT"
          fi
      # Room for the image (about 8 GB) and the build cache. It takes one to two minutes, so
      # it runs while the next steps do, and the step after them waits for it.
      - name: Free disk space in the background
        if: steps.plan.outputs.container == 'true'
        run: |
          rm -f "$RUNNER_TEMP/disk-freed"
          setsid bash -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; touch "$RUNNER_TEMP/disk-freed"' > /dev/null 2>&1 < /dev/null &
      - name: Log in to ghcr.io
        if: steps.plan.outputs.container == 'true' && github.repository == 'kscharpf/aldis'
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Wait for the disk space
        if: steps.plan.outputs.container == 'true'
        run: |
          # The background step touches the file within minutes; the job timeout ends the wait otherwise.
          while [ ! -e "$RUNNER_TEMP/disk-freed" ]; do sleep 2; done
          df -h /
      # The image is pulled when the registry has it for the pins and its labels hold, else
      # built here and pushed, once, before any part starts (VER-060).
      - name: Make sure the registry has the image
        if: steps.plan.outputs.container == 'true' && github.repository == 'kscharpf/aldis'
        run: cargo xtask verify image --push ghcr.io/kscharpf/aldis-verify

  part:
    name: ${{ matrix.group }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read # pull the verification image from ghcr.io (VER-060)
    strategy:
      # The first gating failure cancels the other parts: such a run cannot publish.
      fail-fast: true
      matrix:
        group: [host, cross, coverage, embedded]
    steps:
      - name: Free disk space in the background
        if: needs.prepare.outputs.container == 'true'
        run: |
          rm -f "$RUNNER_TEMP/disk-freed"
          setsid bash -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; touch "$RUNNER_TEMP/disk-freed"' > /dev/null 2>&1 < /dev/null &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: verify
      - name: Log in to ghcr.io
        if: needs.prepare.outputs.container == 'true' && github.repository == 'kscharpf/aldis'
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Wait for the disk space
        if: needs.prepare.outputs.container == 'true'
        run: |
          # The background step touches the file within minutes; the job timeout ends the wait otherwise.
          while [ ! -e "$RUNNER_TEMP/disk-freed" ]; do sleep 2; done
          df -h /
      - name: The checks of the group ${{ matrix.group }} (VER-067)
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify part ${{ matrix.group }}
      # Also after a failure: the part record and the logs say which check failed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: part-${{ matrix.group }}
          path: target/verify/*/
          if-no-files-found: warn
          retention-days: 90

  assemble:
    name: cargo xtask verify assemble --publish (VER-067)
    needs: [prepare, part]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # push refs/notes/verify
      statuses: write # set aldis/verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: verify
      - name: Author of the git note
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Outside target/verify/<commit>, which `verify assemble` empties.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: part-*
          path: ${{ runner.temp }}/parts
      - name: The record of the run from its parts; publish a passing record
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify assemble --publish "$RUNNER_TEMP"/parts/*/*/record.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-${{ github.sha }}
          path: target/verify/*/
          if-no-files-found: warn
          retention-days: 90
