# The verification run on a GitHub-hosted runner, for a contributor who cannot run it locally
# (docs/06-verification.md §7, VER-060). Started only by hand, on a branch:
#
#   gh workflow run verify.yml --ref <branch>
#
# It runs `cargo xtask verify --publish` on the branch's head, as a contributor would: a passing
# record is published under refs/notes/verify and sets the commit status aldis/verify, linked to
# this run (VER-057, VER-058). The logs are this run's artefact.
name: verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: cargo xtask verify --publish (VER-060)
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write # push refs/notes/verify
      statuses: write # set aldis/verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: verify
      - name: Room for the image (about 8 GB) and the build cache
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Author of the git note
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Every check; publish a passing record
        env:
          ALDIS_VERIFY_ENGINE: docker
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask verify --publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-${{ github.sha }}
          path: target/verify/*/
          if-no-files-found: warn
          retention-days: 90
