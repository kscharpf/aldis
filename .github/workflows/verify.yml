# The verification run on a GitHub-hosted runner, for a contributor who cannot run it locally
# (docs/06-verification.md §7, VER-060). Started only by hand, on a branch:
#
#   gh workflow run verify.yml --ref <branch>
#
# It runs `cargo xtask verify --publish` on the branch's head, as a contributor would: a passing
# record is published under refs/notes/verify (VER-057). The run holds no signing key, so the
# record is published unsigned and sets no commit status: it counts for the merge gate, and as a
# source for later commits, once an allowed signer has countersigned it with
# `cargo xtask verify sign <commit>`, which checks that this run of this workflow on that commit
# finished and that its artefact holds the same record, and then sets the commit status
# aldis/verify, linked to this run (VER-058, VER-064). The logs are this run's artefact, and the
# countersignature needs it: it is kept for 90 days.
#
# The verification image comes from ghcr.io/kscharpf/aldis-verify when a workflow of this
# repository has pushed it for the same image inputs (tag `<input hash>-amd64`), and its labels
# hold; otherwise it is built here and pushed (`--push-image`, VER-060). The record names the
# image's source and digest, or, when no gating check needed the container, that no image was
# used. The first push creates the package as private: make it public once, under the
# package's settings (Package settings, Danger Zone, Change visibility), and check that
# "Manage Actions access" gives kscharpf/aldis the Write role.
name: verify

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: cargo xtask verify --publish (VER-060)
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write # push refs/notes/verify; the status is set by the countersignature (VER-064)
      packages: write # push the verification image to ghcr.io (VER-060)
    env:
      ALDIS_VERIFY_ENGINE: docker
      # Use the image this repository's workflows pushed, if its labels hold (VER-060).
      ALDIS_VERIFY_PULL: ghcr.io/kscharpf/aldis-verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: verify
      - name: Room for the image (about 8 GB) and the build cache
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Author of the git note
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Log in to ghcr.io
        if: github.repository == 'kscharpf/aldis'
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      # One step decides whether the run needs the image and gets it: pulled from ghcr.io, or
      # built here and pushed (VER-060), before any check runs. When the input rule skips or
      # reuses every gating check, no image is pulled or built (VER-056). The checks run
      # quickest first, and the run stops at the first gating check that fails, since such a
      # run cannot publish.
      - name: Every check that the change needs; publish a passing record
        env:
          GH_TOKEN: ${{ github.token }}
          # Only this repository's workflows push to the registry (VER-060).
          PUSH: ${{ github.repository == 'kscharpf/aldis' && 'ghcr.io/kscharpf/aldis-verify' || '' }}
        run: |
          if [ -n "$PUSH" ]; then
            cargo xtask verify --publish --push-image "$PUSH"
          else
            cargo xtask verify --publish
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-${{ github.sha }}
          path: target/verify/*/
          if-no-files-found: warn
          retention-days: 90
