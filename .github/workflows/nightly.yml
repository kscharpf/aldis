# Scheduled checks (docs/milestones/m0-foundations.md WP-1, WP-5, WP-6; docs/06-verification.md §7,
# VER-059): the verification run on both Linux architectures, the night-only checks, and the
# process metrics (§9, VER-063).
# Nightly Rust is tooling only (RS-002) and always the date pinned in `tooling-nightly`.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz-seconds:
        description: Seconds per fuzz target (600 nightly; 3600 before a release, VER-022)
        required: false
        default: "600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  big-endian-bare-metal:
    name: big-endian bare metal (armebv7r, -Z build-std)
    # armebv7r-none-eabihf has no prebuilt core for the pinned stable toolchain, so it
    # is built with the tooling nightly + build-std.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          echo "NIGHTLY=$(cat tooling-nightly)" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - run: >
          cargo +"$NIGHTLY" build -Z build-std=core
          -p aldis --no-default-features --features full
          --target armebv7r-none-eabihf

  verify:
    name: cargo xtask verify ${{ matrix.os }} (VER-059)
    # The verification run in its image, as a contributor runs it before a merge (VER-056); the
    # record is uploaded, never published. On ubuntu-24.04 it also runs the x86_64-only checks.
    # The image is always built here, never pulled; on main it is then pushed to ghcr.io for
    # verify.yml and opt-in local runs (VER-060).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write # push the verification image (VER-060)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: verify
      - name: Room for the image (about 8 GB) and the build cache
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Every check, whatever the change against main (VER-059)
        env:
          ALDIS_VERIFY_ENGINE: docker
        run: cargo xtask verify --all
      # The nightly-only check kani runs only here; it gates no merge, but its failure fails
      # this job, so that the issue job reports it (OI-42, VER-059). The other non-gating
      # checks (cpp-leon3, rust-sparc-leon3) stay reported in the record only.
      - name: The nightly-only checks passed (kani, OI-42, VER-059)
        if: ${{ !cancelled() }}
        run: cargo xtask verify nightly
      - name: Push the image built for main (VER-060)
        if: github.ref == 'refs/heads/main' && github.repository == 'kscharpf/aldis'
        env:
          ALDIS_VERIFY_ENGINE: docker
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          cargo xtask verify image --push ghcr.io/kscharpf/aldis-verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-${{ matrix.os }}
          path: target/verify/*/
          if-no-files-found: warn

  stack-sizes:
    name: stack usage ${{ matrix.target }} (VER-011)
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, armv7r-none-eabihf, riscv32imac-unknown-none-elf]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      # `core` is built from source (`-Z build-std`), so the nightly needs rust-src, not the target.
      - run: |
          rustup toolchain install "$(cat tooling-nightly)" --profile minimal \
            --component rust-src --component llvm-tools
      # The worst case of every entry point against its budget (xtask/stack-budgets.toml); the
      # report is the VER-011 table, kept even when a budget fails.
      - run: cargo xtask stack ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stack-sizes-${{ matrix.target }}
          path: target/spec/stack-${{ matrix.target }}.md
          if-no-files-found: error

  fuzz:
    name: fuzz ${{ matrix.target }} (VER-022)
    strategy:
      fail-fast: false
      matrix:
        target:
          - bits_roundtrip
          - crc_variants
          - oid_forms
          - counter_classify
          - container_model
          - layout_ranges
          - anomaly_set_model
          - ocf_classify
          - epp_decode
          - epp_roundtrip
          - time_pfield
          - time_cuc
          - time_cds
          - time_ccs
          - time_ascii
          - spp_decode
          - spp_stream
          - spp_roundtrip
          - spp_tracker_model
          - spp_segment_reassemble
          - spp_time_header
          - ffi_decode
          - aos_fhec_model
          - aos_decode
          - aos_roundtrip
          - tm_decode
          - tm_roundtrip
          - tc_decode
          - tc_roundtrip
          - tc_delimit
          - tc_clcw
          - uslp_decode
          - uslp_truncated
          - uslp_roundtrip
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          echo "NIGHTLY=$(cat ../tooling-nightly)" >> "$GITHUB_ENV"
      # One retry: a transient download failure must not look like a fuzz failure.
      - run: |
          rustup toolchain install "$NIGHTLY" --profile minimal \
            || { sleep 30; rustup toolchain install "$NIGHTLY" --profile minimal; }
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-fuzz@0.13.2
      # The corpus carries over between nights; it is never committed (.gitignore).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        # The prebuilt cargo-fuzz is a musl binary and defaults --target to its own triple,
        # which has no std for the nightly and cannot use AddressSanitizer.
        run: >
          cargo +"$NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --
          -max_total_time=${{ inputs.fuzz-seconds || '600' }}
      # Crash handling runs only when libFuzzer saved an input: a setup or build failure fails
      # the job without opening an issue.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && hashFiles(format('fuzz/artifacts/{0}/*', matrix.target)) != ''
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
      - name: Open an issue for the crash
        # Every crash becomes a regression vector (VER-022); one open issue per target.
        if: failure() && hashFiles(format('fuzz/artifacts/{0}/*', matrix.target)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "fuzz: ${{ matrix.target }} found a failing input"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]; then
            gh issue create --title "$TITLE" --body "Nightly fuzzing failed: $RUN

          Download the \`fuzz-crash-${{ matrix.target }}\` artefact, reproduce with
          \`cargo +$NIGHTLY fuzz run ${{ matrix.target }} <file>\` in \`fuzz/\`, fix, and add the input as a
          regression vector (VER-022)."
          fi

  bit-flips:
    name: bit-flip completeness ${{ matrix.crate }} (M2 WP-7, VER-023)
    # The exhaustive runs that the gated tests only sample: every double-bit error of the longest
    # TM and TC frames, every single-bit error of the longest AOS and USLP frames, and every
    # double-bit error of their 4 095-octet frames, the longest the CRC-16 covers
    # (docs/verification/derivations/crc16-bit-flips.md). Release mode, on every core.
    strategy:
      fail-fast: false
      matrix:
        crate: [aldis-tm, aldis-tc, aldis-aos, aldis-uslp]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bit-flips
      - run: cargo test --release --all-features -p ${{ matrix.crate }} --test bit_flips -- --ignored

  mutants:
    name: mutation testing (VER-025, report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PROPTEST_CASES: 32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: mutants
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-mutants@27.1.0
      # The job was killed twice about 22 minutes in, by a runner shutdown well before its
      # timeout (issue #96): disk and memory are recorded before, every minute during, and after
      # the run. The samples also go to the job log, which outlives a lost runner; the files are
      # kept with the report (cargo-mutants replaces mutants.out/, so they wait in RUNNER_TEMP).
      - name: Resources before
        run: '{ date -u; df -h; free -m; } | tee "$RUNNER_TEMP/resources-before.txt"'
      # Exit 2 (missed mutants) and 3 (timeouts) are reported, not failed: survivors are triaged
      # in docs/verification/mutants-triage.md before each release (VER-025). Anything else
      # (e.g. 4, the unmutated tests fail) is a real failure. The Kani proof modules are left out
      # by .cargo/mutants.toml.
      - run: |
          ( while true; do
              { date -u; df -h / "$RUNNER_TEMP"; free -m; } 2>&1 \
                | sed 's/^/[resources] /' | tee -a "$RUNNER_TEMP/resources-during.txt"
              sleep 60
            done ) &
          sampler=$!
          code=0
          cargo mutants -p aldis-core -p aldis-time -p aldis-epp -p aldis-spp -p aldis-aos -p aldis-tm -p aldis-tc -p aldis-uslp --all-features || code=$?
          kill "$sampler" 2>/dev/null || true
          echo "cargo-mutants exit code $code"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ] || [ "$code" -eq 3 ]
      - name: Resources after
        if: always()
        run: |
          mkdir -p mutants.out
          cp "$RUNNER_TEMP"/resources-*.txt mutants.out/ || true
          { date -u; df -h; free -m; du -sh target mutants.out 2>/dev/null; } \
            | tee mutants.out/resources-after.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants
          path: mutants.out/
          if-no-files-found: warn

  ccsds-urls:
    name: CCSDS document URLs still answer
    # HEAD requests only; the documents are never downloaded in CI (specs/README.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: specs/fetch.sh --all --check-urls

  sana-registries:
    name: SANA registries match their snapshots
    # Downloads each registry of specs/sana/ and fails when it differs from the committed snapshot
    # (M2 plan D13, OI-06); the failure opens the nightly issue, and the snapshot is re-imported
    # with `cargo xtask sana import <registry>` in a pull request.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: sana
      - run: cargo xtask sana check-live

  metrics:
    name: process metrics (VER-063, report only)
    # The report of the last 30 days, kept in the body of the one pinned issue labelled `metrics`
    # (docs/06-verification.md §9). It measures the process, not the code: a failure here (the
    # GitHub API, a rate limit) says nothing about `main`, so `continue-on-error` keeps it from
    # failing the night, and it is not in the `needs` of `issue`, so it never opens the
    # nightly-failure issue.
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: read # the checkout and refs/notes/verify
      issues: write # create, label, pin, and edit the tracking issue
      pull-requests: read # merged pull requests, their commits, files, and reviews
      statuses: read # the aldis/verify commit statuses
      actions: read # the verify.yml runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the merges from main are redone with git merge-tree
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: metrics
      - name: Report for the last 30 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/metrics
          cargo xtask metrics --since "$(date -u -d '30 days ago' +%F)" --format md \
            --json target/metrics/metrics.json > target/metrics/metrics.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: process-metrics
          path: target/metrics/
          if-no-files-found: error
          retention-days: 90
      - name: Keep the report in the pinned issue "Process metrics"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=target/metrics/body.md
          # An issue body holds at most 65536 characters: whole lines up to 60000 bytes, and the
          # per-PR table comes last.
          { awk -v max=60000 '{ n += length($0) + 1; if (n > max) exit; print }' \
              target/metrics/metrics.md
            printf '\n\n---\nUpdated by the nightly run %s; the JSON is its `process-metrics` artefact.\n' "$RUN"
          } > "$body"
          gh label create metrics --repo "$REPO" --color 0e8a16 \
            --description "The process metrics report (VER-063)" 2>/dev/null || true
          number=$(gh issue list --repo "$REPO" --label metrics --state all --limit 1 \
            --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            url=$(gh issue create --repo "$REPO" --title "Process metrics" --label metrics \
              --body-file "$body")
            gh issue pin "${url##*/}" --repo "$REPO"
          else
            gh issue edit "$number" --repo "$REPO" --body-file "$body"
          fi

  issue:
    name: open an issue on a nightly failure (VER-059)
    needs: [big-endian-bare-metal, verify, stack-sizes, fuzz, bit-flips, mutants, ccsds-urls, sana-registries]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: One open issue per workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: "nightly: Nightly failed"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --body "The nightly run failed: $RUN

          A failure on a commit whose published record passed (\`cargo xtask verify check <commit>\`) is a
          defect in the code, the verification image, or \`cargo xtask verify\` until the cause is found
          (VER-059)."
          fi
