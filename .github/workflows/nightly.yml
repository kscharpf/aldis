# Scheduled checks (docs/milestones/m0-foundations.md WP-1, WP-5, WP-6; docs/06-verification.md §7,
# VER-059): the verification run on both Linux architectures, and the night-only checks.
# Nightly Rust is tooling only (RS-002) and always the date pinned in `tooling-nightly`.
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz-seconds:
        description: Seconds per fuzz target (600 nightly; 3600 before a release, VER-022)
        required: false
        default: "600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  big-endian-bare-metal:
    name: big-endian bare metal (armebv7r, -Z build-std)
    # armebv7r-none-eabihf has no prebuilt core for the pinned stable toolchain, so it
    # is built with the tooling nightly + build-std.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          echo "NIGHTLY=$(cat tooling-nightly)" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - run: >
          cargo +"$NIGHTLY" build -Z build-std=core
          -p aldis --no-default-features --features full
          --target armebv7r-none-eabihf

  verify:
    name: cargo xtask verify ${{ matrix.os }} (VER-059)
    # The verification run in its image, as a contributor runs it before a merge (VER-056); the
    # record is uploaded, never published. On ubuntu-24.04 it also runs the x86_64-only checks.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: verify
      - name: Room for the image (about 8 GB) and the build cache
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Every check, C++ included
        env:
          ALDIS_VERIFY_ENGINE: docker
        run: cargo xtask verify --all-cpp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verify-${{ matrix.os }}
          path: target/verify/*/
          if-no-files-found: warn

  stack-sizes:
    name: stack usage ${{ matrix.target }} (VER-011)
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, armv7r-none-eabihf, riscv32imac-unknown-none-elf]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: |
          rustup toolchain install "$(cat tooling-nightly)" --profile minimal \
            --target ${{ matrix.target }}
      - run: cargo xtask stack-sizes ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-sizes-${{ matrix.target }}
          path: target/spec/stack-sizes-${{ matrix.target }}.md
          if-no-files-found: error

  fuzz:
    name: fuzz ${{ matrix.target }} (VER-022)
    strategy:
      fail-fast: false
      matrix:
        target:
          - bits_roundtrip
          - crc_variants
          - oid_forms
          - counter_classify
          - container_model
          - layout_ranges
          - anomaly_set_model
          - epp_decode
          - epp_roundtrip
          - time_pfield
          - time_cuc
          - time_cds
          - time_ccs
          - time_ascii
          - spp_decode
          - spp_stream
          - spp_roundtrip
          - spp_tracker_model
          - spp_segment_reassemble
          - spp_time_header
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          echo "NIGHTLY=$(cat ../tooling-nightly)" >> "$GITHUB_ENV"
      # One retry: a transient download failure must not look like a fuzz failure.
      - run: |
          rustup toolchain install "$NIGHTLY" --profile minimal \
            || { sleep 30; rustup toolchain install "$NIGHTLY" --profile minimal; }
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz@0.13.2
      # The corpus carries over between nights; it is never committed (.gitignore).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        # The prebuilt cargo-fuzz is a musl binary and defaults --target to its own triple,
        # which has no std for the nightly and cannot use AddressSanitizer.
        run: >
          cargo +"$NIGHTLY" fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} --
          -max_total_time=${{ inputs.fuzz-seconds || '600' }}
      # Crash handling runs only when libFuzzer saved an input: a setup or build failure fails
      # the job without opening an issue.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && hashFiles(format('fuzz/artifacts/{0}/*', matrix.target)) != ''
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
      - name: Open an issue for the crash
        # Every crash becomes a regression vector (VER-022); one open issue per target.
        if: failure() && hashFiles(format('fuzz/artifacts/{0}/*', matrix.target)) != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "fuzz: ${{ matrix.target }} found a failing input"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]; then
            gh issue create --title "$TITLE" --body "Nightly fuzzing failed: $RUN

          Download the \`fuzz-crash-${{ matrix.target }}\` artefact, reproduce with
          \`cargo +$NIGHTLY fuzz run ${{ matrix.target }} <file>\` in \`fuzz/\`, fix, and add the input as a
          regression vector (VER-022)."
          fi

  mutants:
    name: mutation testing (VER-025, report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: mutants
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants@27.1.0
      # Exit 2 (missed mutants) and 3 (timeouts) are reported, not failed: survivors are triaged
      # in docs/verification/mutants-triage.md before each release (VER-025). Anything else
      # (e.g. 4, the unmutated tests fail) is a real failure.
      - run: |
          code=0
          cargo mutants -p aldis-core -p aldis-time -p aldis-epp -p aldis-spp --all-features || code=$?
          echo "cargo-mutants exit code $code"
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ] || [ "$code" -eq 3 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants
          path: mutants.out/

  ccsds-urls:
    name: CCSDS document URLs still answer
    # HEAD requests only; the documents are never downloaded in CI (specs/README.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: specs/fetch.sh --all --check-urls

  issue:
    name: open an issue on a nightly failure (VER-059)
    needs: [big-endian-bare-metal, verify, stack-sizes, fuzz, mutants, ccsds-urls]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: One open issue per workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: "nightly: Nightly failed"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --body "The nightly run failed: $RUN

          A failure on a commit whose published record passed (\`cargo xtask verify check <commit>\`) is a
          defect in the code, the verification image, or \`cargo xtask verify\` until the cause is found
          (VER-059)."
          fi
