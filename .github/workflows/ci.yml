# CI for Aldis (docs/milestones/m0-foundations.md WP-1; docs/06-verification.md).
# Actions are pinned by commit SHA; Rust comes from rust-toolchain.toml only (RS-001).
# CCSDS documents are never downloaded here (specs/README.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: fmt (VER-004)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check
      # The exerciser and fuzz targets are separate workspaces (WP-5, WP-6).
      - run: cargo fmt --all --check --manifest-path exerciser/Cargo.toml
      - run: cargo fmt --all --check --manifest-path fuzz/Cargo.toml

  clippy:
    name: clippy (VER-001, VER-002)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: clippy
      - run: cargo clippy --workspace --all-features --all-targets
      - run: cargo doc --workspace --all-features --no-deps
      # Fuzz targets build on stable; only running them needs nightly (RS-002).
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - run: cargo test --workspace --all-features

  no-std:
    name: no_std ${{ matrix.target }} (GEN-005)
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, armv7r-none-eabihf, riscv32imac-unknown-none-elf]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: no-std-${{ matrix.target }}
      - name: Library, no features
        run: cargo build -p aldis --no-default-features --features full --target ${{ matrix.target }}
      - name: Clippy, no features
        run: cargo clippy -p aldis --no-default-features --features full --target ${{ matrix.target }}
      - name: C ABI static library
        # A cdylib cannot be built for bare metal; Cargo's notice about dropping it is
        # not a compiler warning and does not trip RUSTFLAGS=-D warnings.
        run: cargo build -p aldis-ffi --no-default-features --features panic-handler --target ${{ matrix.target }} --release

  big-endian:
    name: big-endian tests (VER-030, GEN-007)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          extra-targets: s390x-unknown-linux-gnu
          cache-key: big-endian
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cross
      - run: cross test --workspace --all-features --target s390x-unknown-linux-gnu

  layers:
    name: layering and minimal build (GEN-001..004, VER-031)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: layers
      - run: cargo xtask layers
      - run: cargo xtask symbols

  exerciser:
    name: exerciser ${{ matrix.target }} (VER-010, GEN-021)
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, armv7r-none-eabihf, riscv32imac-unknown-none-elf]
    runs-on: ubuntu-24.04
    defaults:
      run:
        # exerciser/.cargo/config.toml (QEMU runner) applies only from this directory.
        working-directory: exerciser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: exerciser-${{ matrix.target }}
      - name: Panic-freedom link check
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Clippy
        run: cargo clippy --release --locked --target ${{ matrix.target }}
      - name: Canary — a reachable panic must fail the link
        run: |
          if cargo build --release --locked --target ${{ matrix.target }} --features inject-panic 2> canary.log; then
            echo "::error::exerciser linked with a reachable panic; the VER-010 check is broken"
            exit 1
          fi
          grep -q aldis_panic_is_unreachable canary.log
          echo "canary failed to link, as it should"
      - name: Install QEMU
        if: matrix.target == 'thumbv7em-none-eabihf'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-arm
      - name: Vectors on Cortex-M4 (QEMU mps2-an386)
        if: matrix.target == 'thumbv7em-none-eabihf'
        # A link-only check still gates if QEMU misbehaves (m0 plan risk table); one retry.
        run: |
          timeout 120 cargo run --release --locked --target ${{ matrix.target }} \
            || timeout 120 cargo run --release --locked --target ${{ matrix.target }}

  coverage:
    name: coverage (VER-024)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: coverage
      - name: Install pinned tooling nightly (RS-002)
        run: rustup toolchain install "$(cat tooling-nightly)" --profile minimal --component llvm-tools
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo xtask coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: target/spec/coverage-*
          if-no-files-found: error

  spec:
    name: spec, links, vectors, trace (VER-020, TV-001..003)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: xtask
      - run: cargo xtask spec-lint
      - run: cargo xtask links
      - run: cargo xtask vectors validate
      - run: cargo xtask vectors schema --check
      # M0 is closed: every in-scope requirement must keep an artefact (VER-020).
      - run: cargo xtask trace --scope m0 --strict
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trace-m0
          path: target/spec/
          if-no-files-found: error

  deny:
    name: licenses, advisories, sources (VER-003)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check
