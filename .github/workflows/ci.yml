# Nightly native Rust jobs (docs/06-verification.md §7, VER-059; m0 plan WP-1).
# Pull requests merge on a local `cargo xtask verify` record (VER-058), whose checks carry these
# job names; this workflow repeats them each night on GitHub's runners, without the verification
# image, and opens an issue on a failure. Actions are pinned by commit SHA; Rust comes from
# rust-toolchain.toml only (RS-001).
# CCSDS documents are never downloaded here (specs/README.md).
name: CI

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: fmt (VER-004)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all --check
      # The exerciser, fuzz targets, and cross-checks are separate workspaces (WP-5, WP-6, M1 WP-4).
      - run: cargo fmt --all --check --manifest-path exerciser/Cargo.toml
      - run: cargo fmt --all --check --manifest-path fuzz/Cargo.toml
      - run: cargo fmt --all --check --manifest-path crosscheck/Cargo.toml

  clippy:
    name: clippy (VER-001, VER-002)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: clippy
      - run: cargo clippy --workspace --all-features --all-targets
      - run: cargo doc --workspace --all-features --no-deps
      # Fuzz targets build on stable; only running them needs nightly (RS-002).
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path crosscheck/Cargo.toml --all-targets

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - run: cargo test --workspace --all-features

  features:
    name: additive alloc and std features (GEN-006)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: features
      - run: cargo xtask features

  header:
    name: C header, host libraries, C99 and C++11 (CABI-001..003)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: header
      - name: Install the pinned cbindgen (CABI-002; xtask/src/header.rs)
        run: cargo install --locked cbindgen@0.29.4
      - run: cargo xtask header
      # The runner's GCC and Clang; the verification image runs the pinned ones (CABI-003).
      - run: cargo xtask header c-smoke gcc g++
      - run: cargo xtask header c-smoke clang clang++

  no-std:
    name: no_std ${{ matrix.target }} (GEN-005)
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, armv7r-none-eabihf, riscv32imac-unknown-none-elf]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: no-std-${{ matrix.target }}
      - name: Library, no features
        run: cargo build -p aldis --no-default-features --features full --target ${{ matrix.target }}
      - name: Clippy, no features
        run: cargo clippy -p aldis --no-default-features --features full --target ${{ matrix.target }}
      - name: C ABI static library
        # A cdylib cannot be built for bare metal; Cargo's notice about dropping it is
        # not a compiler warning and does not trip RUSTFLAGS=-D warnings.
        run: cargo build -p aldis-ffi --no-default-features --features panic-handler --target ${{ matrix.target }} --release
      - name: No heap, threads, or C runtime needed (CABI-004)
        run: cargo xtask ffi-imports ${{ matrix.target }}

  big-endian:
    name: big-endian tests (VER-030, GEN-007)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          extra-targets: s390x-unknown-linux-gnu
          cache-key: big-endian
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cross
      # xtask is host tooling, and its tests need a newer git (`merge-tree --write-tree`, 2.38)
      # than the cross image has; the verify check `big-endian` still runs them.
      - run: cross test --workspace --all-features --target s390x-unknown-linux-gnu --exclude xtask

  layers:
    name: layering and minimal build (GEN-001..004, VER-031)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: layers
      - run: cargo xtask layers
      - run: cargo xtask symbols
      # refapp/ uses Aldis only through the facade and forbids unsafe (APP-100, APP-105).
      - run: cargo xtask refapp-deps

  refapp:
    name: refapp (APP-102..APP-107, VER-001, VER-004)
    runs-on: ubuntu-24.04
    defaults:
      run:
        # refapp/ is its own workspace (docs/reference-application.md §9, APP-106).
        working-directory: refapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: refapp
          workspaces: refapp -> target
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: Flight node, bare metal (APP-102)
        run: |
          cargo build -p refapp-flight --target thumbv7em-none-eabihf --locked
          cargo clippy -p refapp-flight --target thumbv7em-none-eabihf --locked
      - name: Generated scenario files are current (APP-107)
        run: cargo run -p refapp-harness --locked -- gen-scenario --check
      - name: Golden traces are canonical and reproduced (APP-080, APP-085)
        run: |
          cargo run -p refapp-harness --locked -- check-golden
          cargo run -p refapp-harness --locked -- compare

  exerciser:
    name: exerciser ${{ matrix.target }} (VER-010, GEN-021)
    strategy:
      fail-fast: false
      matrix:
        target: [thumbv7em-none-eabihf, armv7r-none-eabihf, riscv32imac-unknown-none-elf]
    runs-on: ubuntu-24.04
    defaults:
      run:
        # exerciser/.cargo/config.toml (QEMU runner) applies only from this directory.
        working-directory: exerciser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: exerciser-${{ matrix.target }}
      - name: Panic-freedom link check
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Clippy
        run: cargo clippy --release --locked --target ${{ matrix.target }}
      - name: Canary — a reachable panic must fail the link
        run: |
          if cargo build --release --locked --target ${{ matrix.target }} --features inject-panic 2> canary.log; then
            echo "::error::exerciser linked with a reachable panic; the VER-010 check is broken"
            exit 1
          fi
          grep -q aldis_panic_is_unreachable canary.log
          echo "canary failed to link, as it should"
      - name: Install QEMU
        # Ubuntu 24.04 packages: qemu-system-arm (Cortex-M, Cortex-R), qemu-system-misc (RISC-V).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-system-misc
          case "${{ matrix.target }}" in
            riscv32*) qemu-system-riscv32 --version ;;
            *) qemu-system-arm --version ;;
          esac
      - name: Vectors on target (QEMU, M1 D6)
        # The QEMU command of each target is its runner in exerciser/.cargo/config.toml:
        # mps2-an386 (Cortex-M4), none + cortex-r5f (Cortex-R5F), virt (RV32).
        # QEMU can misbehave on a busy runner (m0 plan risk table); one retry.
        run: |
          timeout 120 cargo run --release --locked --target ${{ matrix.target }} \
            || timeout 120 cargo run --release --locked --target ${{ matrix.target }}

  coverage:
    name: coverage (VER-024)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: coverage
      - name: Install pinned tooling nightly (RS-002)
        run: rustup toolchain install "$(cat tooling-nightly)" --profile minimal --component llvm-tools
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - run: cargo xtask coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: target/spec/coverage-*
          if-no-files-found: error

  spec:
    name: spec, links, vectors, trace (VER-020, TV-001..003)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: xtask
      - run: cargo xtask spec-lint
      - run: cargo xtask links
      # The decision log is well formed (VER-062).
      - run: cargo xtask decisions
      - run: cargo xtask vectors validate
      - run: cargo xtask vectors schema --check
      # The field catalogue and the files generated from it (API-082, m2 plan D2).
      - run: cargo xtask fields
      - run: cargo xtask sana
      # The per-crate, fuzz-target, and vector-file registrations agree
      # (docs/milestones/checklists.md).
      - run: cargo xtask consistency
      # Independent cross-check of the vectors (VER-040); fails on any disagreement. Its own
      # tests first: the harness must report a difference it is shown.
      - run: cargo test --manifest-path crosscheck/Cargo.toml
      - run: cargo run --manifest-path crosscheck/Cargo.toml
      - run: cargo xtask changelog check
      # M0 is closed: every in-scope requirement must keep an artefact (VER-020).
      - run: cargo xtask trace --scope m0 --strict
      # M1 is closed: every in-scope requirement must keep an artefact (VER-020, m1 plan D8).
      - run: cargo xtask trace --scope m1 --strict
      # M2 is open: its trace is reported, and becomes --strict at the M2 exit (m2 plan D1).
      - run: cargo xtask trace --scope m2
      # C0 is open: its trace is reported, and becomes --strict at the C0 exit (c0 plan D17).
      - run: cargo xtask trace --scope c0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trace-m0
          path: target/spec/
          if-no-files-found: error

  deny:
    name: licenses, advisories, sources (VER-003)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny
      - run: cargo deny --all-features check
      # The reference application's own workspace, same policy (APP-106): cargo-deny finds the
      # root deny.toml by searching upwards from refapp/Cargo.toml.
      - run: cargo deny --manifest-path refapp/Cargo.toml --all-features --log-level info check
      # The cross-check workspace finds its own crosscheck/deny.toml first: the root policy plus
      # the exceptions recorded in docs/verification/cross-checks.md §1.
      - run: cargo deny --manifest-path crosscheck/Cargo.toml --all-features --log-level info check

  issue:
    name: open an issue on a nightly failure (VER-059)
    needs: [fmt, clippy, test, features, header, no-std, big-endian, layers, refapp, exerciser, coverage, spec, deny]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: One open issue per workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: "nightly: CI failed"
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" --json number --jq '.[].number')" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --body "The nightly run failed: $RUN

          A failure on a commit whose published record passed (\`cargo xtask verify check <commit>\`) is a
          defect in the code, the verification image, or \`cargo xtask verify\` until the cause is found
          (VER-059)."
          fi
