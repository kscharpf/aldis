version: 2
updates:
  # Keeps SHA-pinned actions current (the version comment is updated too).
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup-rust"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Dev-dependencies only; Layers 0-2 have no runtime dependencies (GEN-001).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
