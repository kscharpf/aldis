name: Set up pinned toolchains
description: >
  Installs the toolchains pinned in toolchains.lock: archives verified by SHA-256 and cached by
  checksum, apt packages at their exact locked version. Checks and prints every installed version.
  Never installs a floating version. The counterpart of setup-rust.

inputs:
  tools:
    description: >
      Space-separated tools: llvm gcc gcc-s390x qemu, or "all" for every tool the lock file provides
      for the runner's architecture.
    required: true

runs:
  using: composite
  steps:
    - name: Cache keys from toolchains.lock
      id: keys
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      # TOOLS is split into words on purpose.
      run: python3 -I "$GITHUB_ACTION_PATH/setup_cpp.py" cache-keys $TOOLS >> "$GITHUB_OUTPUT"

    # One cache per archive, keyed by its checksum, so jobs that need the same tool share it.
    - name: Cache LLVM archive
      if: steps.keys.outputs.llvm != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/aldis-cpp/llvm
        key: aldis-cpp-llvm-${{ steps.keys.outputs.llvm }}

    - name: Install and check versions
      shell: bash
      env:
        TOOLS: ${{ inputs.tools }}
      run: python3 -I "$GITHUB_ACTION_PATH/setup_cpp.py" install $TOOLS
