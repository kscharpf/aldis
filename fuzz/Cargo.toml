[package]
name = "aldis-fuzz"
description = "cargo-fuzz targets for Aldis (VER-022)"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Separate workspace: the targets need nightly and libFuzzer, which the main workspace must not
# depend on (RS-002). Run with `cargo +$(cat ../tooling-nightly) fuzz run <target>`.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
aldis-aos = { path = "../crates/aldis-aos" }
aldis-cop1 = { path = "../crates/aldis-cop1" }
aldis-core = { path = "../crates/aldis-core", features = ["crc-table", "test-hooks"] }
aldis-epp = { path = "../crates/aldis-epp" }
aldis-ffi = { path = "../crates/aldis-ffi" }
aldis-spp = { path = "../crates/aldis-spp", features = ["time"] }
aldis-tc = { path = "../crates/aldis-tc" }
aldis-time = { path = "../crates/aldis-time" }
aldis-tm = { path = "../crates/aldis-tm" }
aldis-uslp = { path = "../crates/aldis-uslp" }
aldis-testkit = { path = "../crates/aldis-testkit" }
libfuzzer-sys = "0.4.13"

# Tooling lint profile (RS-017): assertions are how a fuzz target reports a failure.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Selected nursery lints (RS-019). The nursery group itself stays off.
missing_const_for_fn = "deny"
derive_partial_eq_without_eq = "deny"
too_long_first_doc_paragraph = "deny"
redundant_clone = "deny"
fallible_impl_from = "deny"
non_send_fields_in_send_ty = "deny"
transmute_undefined_repr = "deny"
debug_assert_with_mut_call = "deny"
needless_pass_by_ref_mut = "deny"
large_stack_frames = "deny"
collection_is_never_read = "deny"

[profile.release]
debug = 1

[[bin]]
name = "bits_roundtrip"
path = "fuzz_targets/bits_roundtrip.rs"
test = false
doc = false
bench = false

