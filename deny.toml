# cargo-deny configuration (VER-003, GEN-001). Run: cargo deny --all-features check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Licenses compatible with distributing Aldis under MIT.
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9
# The allow list is the policy for future dev-dependencies; unused entries are expected today.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are publish = false until the first release.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates have no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
