[package]
name = "aldis-exerciser"
description = "Bare-metal exerciser: panic-freedom link check (VER-010) and on-target vector run"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
publish = false
build = "build.rs"

# Separate workspace: a no_std/no_main binary cannot be built for the host, so it is not a
# member of the main workspace (docs/milestones/m0-foundations.md WP-5).
[workspace]

[[bin]]
name = "exerciser"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aldis-aos = { path = "../crates/aldis-aos", default-features = false }
aldis-cop1 = { path = "../crates/aldis-cop1", default-features = false, features = ["uslp"] }
aldis-core = { path = "../crates/aldis-core", default-features = false, features = ["crc-table", "test-hooks"] }
aldis-epp = { path = "../crates/aldis-epp", default-features = false }
# The C ABI (M2 plan D16), with its panic handler for the link check: it calls the undefined
# aldis_panic_is_unreachable (VER-010), and is the only panic handler of the image.
aldis-ffi = { path = "../crates/aldis-ffi", default-features = false, features = ["panic-unreachable"] }
aldis-spp = { path = "../crates/aldis-spp", default-features = false, features = ["time"] }
aldis-tc = { path = "../crates/aldis-tc", default-features = false }
aldis-time = { path = "../crates/aldis-time", default-features = false }
aldis-uslp = { path = "../crates/aldis-uslp", default-features = false }
aldis-tm = { path = "../crates/aldis-tm", default-features = false }

[build-dependencies]
aldis-testkit = { path = "../crates/aldis-testkit" }
serde_json = "1.0.154"

[features]
# Canary: plants a reachable panic so CI can prove the link check fails when it should.
inject-panic = []

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"

[profile.dev]
panic = "abort"

[lints.rust]
# `#[unsafe(no_mangle)]`, the vector table section, and the semihosting `bkpt` need unsafe;
# each use carries #[expect] and a SAFETY comment.
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
as_conversions = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
alloc_instead_of_core = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
string_slice = "deny"
infinite_loop = "deny"
mem_forget = "deny"
as_pointer_underscore = "deny"
lossy_float_literal = "deny"
# Selected nursery lints (RS-019). The nursery group itself stays off.
missing_const_for_fn = "deny"
derive_partial_eq_without_eq = "deny"
too_long_first_doc_paragraph = "deny"
redundant_clone = "deny"
fallible_impl_from = "deny"
non_send_fields_in_send_ty = "deny"
transmute_undefined_repr = "deny"
debug_assert_with_mut_call = "deny"
needless_pass_by_ref_mut = "deny"
large_stack_frames = "deny"
collection_is_never_read = "deny"
