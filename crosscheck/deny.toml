# cargo-deny configuration for the crosscheck/ workspace (VER-003). It repeats ../deny.toml and
# adds the exceptions the independent implementations need (docs/verification/cross-checks.md §1).
# Keep the shared part in step with ../deny.toml.
# Run: cargo deny --manifest-path crosscheck/Cargo.toml --all-features check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable; a build-time macro dependency of spacepackets in a dev-only workspace that is never shipped (cross-checks.md §1)" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
