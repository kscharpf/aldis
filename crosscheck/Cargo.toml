[package]
name = "aldis-crosscheck"
description = "Runs the Aldis test vectors through independent implementations (VER-040)"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Separate workspace: the independent implementations are third-party std crates that the main
# workspace must not depend on (GEN-001). Its own deny.toml carries the exceptions they need
# (docs/verification/cross-checks.md §1).
[workspace]

[dependencies]
# The vector model and loader only; no Aldis codec is linked.
aldis-testkit = { path = "../crates/aldis-testkit" }
# The u11/u14 field types in spacepackets' API, which it does not re-export.
arbitrary-int = "2.2.0"
serde_json = "1.0.154"
# Pinned exactly: a new release can change what the cross-check reports (cross-checks.md §1).
spacepackets = "=0.18.0"

# Tooling lint profile (RS-017).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Selected nursery lints (RS-019). The nursery group itself stays off.
missing_const_for_fn = "deny"
derive_partial_eq_without_eq = "deny"
too_long_first_doc_paragraph = "deny"
redundant_clone = "deny"
