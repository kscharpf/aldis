[package]
name = "aldis-crosscheck"
description = "Runs the Aldis test vectors through independent implementations (VER-040)"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Separate workspace: the independent implementations are third-party std crates and C sources
# that the main workspace must not depend on (GEN-001). Its own deny.toml carries the exceptions
# they need (docs/verification/cross-checks.md §1).
[workspace]

[dependencies]
# The vector model and loader, and the Space Packet strategies of the cFE property check.
aldis-testkit = { path = "../crates/aldis-testkit", features = ["strategies-spp"] }
# The Aldis side of the cFE check, which compares cFE with Aldis as well as with the vectors.
# The spacepackets checks use neither.
aldis-core = { path = "../crates/aldis-core" }
aldis-spp = { path = "../crates/aldis-spp", features = ["time"] }
aldis-time = { path = "../crates/aldis-time" }
# The date types that spacepackets' ASCII formatting takes, which it does not re-export. Already
# in its dependency tree (its `std` feature enables `chrono`), so this adds no crate.
chrono = { version = "0.4.45", default-features = false }
# The u11/u14 field types in spacepackets' API, which it does not re-export.
arbitrary-int = "2.2.0"
serde_json = "1.0.154"
# Pinned exactly: a new release can change what the cross-check reports (cross-checks.md §1).
spacepackets = "=0.18.0"

[build-dependencies]
# Compiles the vendored cFE MSG sources (vendor/cfe/). Already in this workspace's tree.
cc = "1.9.0"

# Tooling lint profile (RS-017).
[lints.rust]
# Denied, not forbidden: the cFE bindings (src/cfe_msg.rs) relax it for that module only.
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Selected nursery lints (RS-019). The nursery group itself stays off.
missing_const_for_fn = "deny"
derive_partial_eq_without_eq = "deny"
too_long_first_doc_paragraph = "deny"
redundant_clone = "deny"
fallible_impl_from = "deny"
non_send_fields_in_send_ty = "deny"
transmute_undefined_repr = "deny"
debug_assert_with_mut_call = "deny"
needless_pass_by_ref_mut = "deny"
large_stack_frames = "deny"
collection_is_never_read = "deny"
